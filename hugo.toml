baseURL = 'https://brot.dev/'
author = "Alex Kellermann"
locale = 'en-us'
title = 'BROT.DEV 🍞'
theme = 'brot'
enableInlineShortcodes = true
pluralizelisttitles = false
enableRobotsTXT = true

[pagination]
  pagerSize = 15

[params]
assets.disableScrollBarStyle = true
hidesummary = true
env = "production" 
description = "Alex Kellermann's personal site featuring photography gear reviews, cybersecurity insights, and technical tutorials. Explore camera guides, security articles, and more."
author = "Alex Kellermann"
defaultTheme = "auto"
images = ["brotheader.png"]
hideAuthor = true

[params.label]
  text = "🍞 brot.dev"

# ----------------------------------------------------------------------------
# Structured data (schema.org / JSON-LD) — drives partials/templates/schema_json.html
#
# Section → schema-type routing lives here (not in templates) so renaming a
# content section or adding a new one only touches this block:
#   • personSection : the section whose page represents the site's Person (you)
#   • blogSections  : sections whose pages are Blogs / BlogPostings (append to grow)
#   • publisherType : entity type for the site's author/publisher (Person | Organization)
# ----------------------------------------------------------------------------
[params.schema]
  publisherType = "Person"
  personSection = "about"
  blogSections  = ["posts", "gallery"]

  # Identity used to build the canonical Person entity.
  jobTitle   = "Security Engineer"
  knowsAbout = ["Cloud Security", "Application Security", "Photography"]
  sameAs = [
    "https://www.instagram.com/7traindelay/",
    "https://www.linkedin.com/in/alexkellermann/",
    "https://github.com/akellermann97",
  ]


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = false
    [markup.goldmark.extensions.extras]
      [markup.goldmark.extensions.extras.delete]
          enable = true
      [markup.goldmark.extensions.extras.subscript]
          enable = true
    [markup.goldmark.extensions.passthrough]
        enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "gallery"
    name = "gallery"
    url = "/gallery/"
    weight = 2 
  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 3 


[[module.mounts]]
    source = 'assets'
    target = 'assets'
[[module.mounts]]
    source = 'static'
    target = 'assets'
[[module.mounts]]
    source = 'static'
    target = 'static'
[[module.mounts]]
    source = 'assets'
    target = 'static'
